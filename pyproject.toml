[tool.poetry]
name = "adaptive-insight-engine"
version = "0.1.0"
description = "An adaptive insight engine for data analysis and visualization"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    { include = "adaptive_insight_engine" },
    { include = "utils" },
    { include = "interfaces" },
    { include = "tests" },
    { include = "eval" },
    { include = "deployment" }
]
package-mode = true


[tool.poetry.dependencies]
python = ">=3.9,<3.14,!=3.9.7"
streamlit = "^1.33.0"
fastapi = "^0.115.0"
pydantic = "^2.6.4"
uvicorn = "^0.34.0"
structlog = "^24.1.0"
python-dotenv = "^1.0.1"
google-cloud-storage = "^2.16.0"
google-cloud-bigquery = "^3.19.0"
pandas = "^2.2.2"
numpy = "^1.26.4"
scikit-learn = "^1.4.2"
statsmodels = "^0.14.2"
openpyxl = "^3.1.2"
PyPDF2 = "^3.0.1"
pytest = "^8.2.0"
google-adk = "^1.0.0"
immutabledict = "^4.2.1"
sqlglot = "^26.10.1"
db-dtypes = "^1.4.2"
regex = "^2024.11.6"
tabulate = "^0.9.0"
google-cloud-aiplatform = "^1.95.0"
absl-py = "^2.2.2"


[tool.poetry.group.dev.dependencies]
google-cloud-aiplatform = { extras = [
    "adk",
    "agent-engines",
    "evaluation",
], version = "^1.95.0" }
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
black = "^24.4.0"
isort = "^5.13.2"
flake8 = "^7.0.0"


[tool.pytest.ini_options]
console_output_style = "progress"
addopts = "-vv -s"
#addopts = "-vv -s --pdb"
testpaths = ["tests/"]
log_level = "DEBUG"
log_cli = true
log_auto_indent = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "[%(asctime)s] %(levelname)s (%(funcName)s) \t [%(pathname)s:%(lineno)d] %(message)s"
filterwarnings = [
    #"error",
    "ignore::UserWarning",
    # note the use of single quote below to denote "raw" strings in TOML
    #'ignore:function ham\(\) is deprecated:DeprecationWarning',
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
run-streamlit = "interfaces.streamlit_app:main"
run-api = "interfaces.rest_api:main"
